---
name:  condLogReg
title: Conditional Logistic Regression
jrs:   '1.1'

refs:
    - survival
    - breslow1978

items:
    - name: sets
      title: Matched Sets
      type: Table
      description: a table of the composition of the matched sets
      visible: (setSummary)
      clearWith:
        - dep
        - strata
        - covs
        - factors
        - blocks
        - refLevels
      columns:
        - name: cases
          title: Cases
          type: integer
          superTitle: Per set

        - name: controls
          title: Controls
          type: integer
          superTitle: Per set

        - name: nSets
          title: Sets
          type: integer

        - name: nObs
          title: Observations
          type: integer

    - name: desc
      title: Descriptives
      type: Table
      description: a table of the covariates (mean ± SD) and factors (n, %) by the levels of the dependent variable
      visible: (descTable)
      clearWith:
        - dep
        - strata
        - covs
        - factors
        - refLevels
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true

        - name: level
          title: ''
          type: text

        - name: ctrl
          title: Controls
          type: text

        - name: cases
          title: Cases
          type: text

        - name: total
          title: Total
          type: text

    - name: modelFit
      title: Model Fit Measures
      type: Table
      clearWith:
        - dep
        - strata
        - blocks
        - ties
      visible: (dev || aic || bic || pseudoR2:r2mf || pseudoR2:r2cs || pseudoR2:r2n || modelTest)

      columns:
        - name: model
          title: "Model"
          type: text

        - name: dev
          title: Deviance
          type: number
          visible: (dev)

        - name: aic
          title: AIC
          type: number
          visible: (aic)

        - name: bic
          title: BIC
          type: number
          visible: (bic)

        - name: r2mf
          title: R²<sub>McF</sub>
          type: number
          visible: (pseudoR2:r2mf)

        - name: r2cs
          title: R²<sub>CS</sub>
          type: number
          visible: (pseudoR2:r2cs)

        - name: r2n
          title: R²<sub>N</sub>
          type: number
          visible: (pseudoR2:r2n)

        - name: chi
          title: χ²
          type: number
          superTitle: Overall Model Test
          visible: (modelTest)

        - name: df
          title: df
          type: integer
          superTitle: Overall Model Test
          visible: (modelTest)

        - name: p
          title: p
          type: number
          format: zto,pvalue
          superTitle: Overall Model Test
          visible: (modelTest)

    - name: modelComp
      title: Model Comparisons
      type: Table
      clearWith:
        - dep
        - strata
        - blocks
        - ties

      columns:
        - name: model1
          title: 'Model'
          content: .
          type: text
          superTitle: Comparison

        - name: sep
          title: ""
          content: "-"
          type: text
          format: narrow
          superTitle: Comparison

        - name: model2
          title: 'Model'
          content: .
          type: text
          superTitle: Comparison

        - name: chi
          title: χ²
          type: number

        - name: df
          title: df
          type: integer

        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: models
      title: Model Specific Results
      type: Array
      layout: listSelect
      hideHeadingOnlyChild: true
      description: an array of model specific results
      clearWith:
        - blocks
      template:

        title: ''
        type: Group
        items:

          - name: lrt
            title: Omnibus Likelihood Ratio Tests
            type: Table
            clearWith:
                - dep
                - strata
                - blocks
                - ties
            description: a table of likelihood ratio tests
            visible: (omni)
            columns:

              - name: term
                title: "Predictor"
                type: text

              - name: chi
                title: χ²
                type: number

              - name: df
                title: df
                type: integer

              - name: p
                title: p
                type: number
                format: zto,pvalue

          - name: coef
            title: '`Model Coefficients - ${dep}`'
            type: Table
            clearWith:
                - dep
                - strata
                - blocks
                - refLevels
                - ties
                - uniMulti
                - trend
                - ciWidth
                - covScales
            description: a table of model coefficients
            refs: gail1981
            columns:

              - name: var
                title: ''
                type: text
                combineBelow: true

              - name: level
                title: ''
                type: text

              - name: or_u
                title: OR
                type: number
                superTitle: Univariable
                visible: (uniMulti)

              - name: lower_u
                title: Lower
                type: number
                superTitle: Univariable
                visible: (uniMulti)

              - name: upper_u
                title: Upper
                type: number
                superTitle: Univariable
                visible: (uniMulti)

              - name: p_u
                title: p
                type: number
                format: zto,pvalue
                superTitle: Univariable
                visible: (uniMulti)

              - name: ptrend_u
                title: p trend
                type: number
                format: zto,pvalue
                superTitle: Univariable
                visible: (uniMulti && trend)

              - name: or
                title: OR
                type: number

              - name: lower
                title: Lower
                type: number

              - name: upper
                title: Upper
                type: number

              - name: p
                title: p
                type: number
                format: zto,pvalue

              - name: ptrend
                title: p trend
                type: number
                format: zto,pvalue
                visible: (trend)

              - name: est
                title: Estimate
                type: number
                visible: (coefDetails)

              - name: se
                title: SE
                type: number
                visible: (coefDetails)

              - name: z
                title: Z
                type: number
                visible: (coefDetails)

          - name: forest
            title: Forest plot
            type: Image
            width: 700
            height: 300
            renderFun: .forestPlot
            visible: (forest)
            clearWith:
                - dep
                - strata
                - blocks
                - refLevels
                - ties
                - uniMulti
                - ciWidth
                - covScales

          - name: assump
            title: Assumption Checks
            type: Group
            items:

            - name: collin
              title: Collinearity Statistics
              type: Table
              description: a table containing the collinearity statistics
              visible: (collin)
              refs: fox1992
              clearWith:
                - dep
                - strata
                - blocks
                - ties
              columns:
                - name: term
                  title: ''
                  type: text

                - name: vif
                  title: VIF
                  type: number

                - name: tol
                  title: Tolerance
                  type: number
...
